# Intégration continue : à chaque push sur main et à chaque Pull Request,
# GitHub lance les tests puis vérifie que l'image Docker se construit.
# Résultat visible dans l'onglet "Actions" du dépôt et directement dans chaque Pull Request.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Droits minimum : lecture seule du code
permissions:
  contents: read

jobs:
  tests:
    name: Tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Lancer les tests
        # Aucun secret nécessaire : les tests utilisent H2 et des identifiants factices
        run: |
          chmod +x mvnw
          ./mvnw -B test

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build -t ai-prospect-hunter:ci .
