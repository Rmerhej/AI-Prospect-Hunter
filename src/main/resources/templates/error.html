<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<!--
    Page d'erreur générale : Spring Boot l'utilise automatiquement à la place de
    la page blanche "Whitelabel Error Page" (adresse inconnue, erreur interne...).
    Variables fournies par Spring Boot : status, error, path.
-->
<head th:replace="~{fragments/layout :: head('Erreur')}"></head>

<body class="bg-light">

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5 text-center">

                    <div class="display-4 fw-bold text-secondary" th:text="${status}">Erreur</div>

                    <h1 class="h4 mt-2" th:switch="${status}">
                        <span th:case="404">Cette page n'existe pas.</span>
                        <span th:case="403">Accès refusé.</span>
                        <span th:case="400">Requête invalide.</span>
                        <span th:case="*">Une erreur inattendue s'est produite.</span>
                    </h1>

                    <p class="text-secondary small" th:if="${path}">
                        Adresse : <code th:text="${path}"></code>
                    </p>

                    <a th:href="@{/}" class="btn btn-primary mt-2">
                        <i class="bi bi-house"></i> Retour à l'accueil
                    </a>

                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
