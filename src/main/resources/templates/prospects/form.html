<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${prospect.id == null ? 'Nouveau prospect' : 'Modifier le prospect'})}"></head>

<body class="bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <h1 class="h3 mb-4"
                        th:text="${prospect.id == null} ? 'Ajouter un prospect' : 'Modifier le prospect'">
                        Ajouter un prospect
                    </h1>

                    <form th:action="@{/prospects}"
                          th:object="${prospect}"
                          method="post"
                          novalidate>

                        <input type="hidden" th:field="*{id}">

                        <!-- Identité -->
                        <div class="mb-3">
                            <label class="form-label" for="name">Nom de l'organisme *</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   th:errorclass="is-invalid"
                                   placeholder="Ex : Association XYZ">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="website">Site web</label>
                            <input type="url"
                                   class="form-control"
                                   th:field="*{website}"
                                   th:errorclass="is-invalid"
                                   placeholder="https://www.exemple.fr">
                            <div class="invalid-feedback" th:errors="*{website}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label" for="city">Ville</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{city}"
                                       th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{city}"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="postalCode">Code postal</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{postalCode}"
                                       th:errorclass="is-invalid"
                                       inputmode="numeric"
                                       maxlength="5">
                                <div class="invalid-feedback" th:errors="*{postalCode}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="sector">Secteur d'activité</label>
                            <select class="form-select" th:field="*{sector}">
                                <option value="">Choisir un secteur</option>
                                <option value="Association">Association</option>
                                <option value="Formation">Organisme de formation</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>

                        <!-- Suivi commercial -->
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="status">Statut</label>
                                <select class="form-select"
                                        th:field="*{status}"
                                        th:errorclass="is-invalid">
                                    <option th:each="s : ${statuses}"
                                            th:value="${s}"
                                            th:text="${s.libelle}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{status}"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="statutFinancement">Financement</label>
                                <select class="form-select"
                                        th:field="*{statutFinancement}"
                                        th:errorclass="is-invalid">
                                    <option th:each="statut : ${statutsFinancement}"
                                            th:value="${statut}"
                                            th:text="${statut.libelle}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{statutFinancement}"></div>
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label" for="horizonProjet">Horizon du projet</label>
                                <select class="form-select"
                                        th:field="*{horizonProjet}"
                                        th:errorclass="is-invalid">
                                    <option th:each="horizon : ${horizonsProjet}"
                                            th:value="${horizon}"
                                            th:text="${horizon.libelle}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{horizonProjet}"></div>
                            </div>
                        </div>

                        <!-- Analyse -->
                        <div class="mb-3">
                            <label class="form-label" for="description">Présentation de l'organisme</label>
                            <textarea class="form-control"
                                      th:field="*{description}"
                                      th:errorclass="is-invalid"
                                      rows="3"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="potentialNeed">Besoin numérique potentiel</label>
                            <textarea class="form-control"
                                      th:field="*{potentialNeed}"
                                      th:errorclass="is-invalid"
                                      rows="3"
                                      placeholder="Ex : planning des formateurs, émargement numérique..."></textarea>
                            <div class="invalid-feedback" th:errors="*{potentialNeed}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Enregistrer
                            </button>

                            <a th:href="@{/prospects}" class="btn btn-outline-secondary">
                                Annuler
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
