<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Nouveau prospect - AI Prospect Hunter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            AI Prospect Hunter
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <h1 class="h3 mb-4">Ajouter un prospect</h1>

                    <form th:action="@{/prospects}"
                          th:object="${prospect}"
                          method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label">Nom de l'organisme *</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   placeholder="Ex : Association XYZ">

                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Site web</label>
                            <input type="url"
                                   class="form-control"
                                   th:field="*{website}"
                                   placeholder="https://www.exemple.fr">
                        </div>

                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Ville</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{city}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label">Code postal</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{postalCode}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="statutFinancement" class="form-label">
                                Statut du financement
                            </label>

                            <select id="statutFinancement"
                                    th:field="*{statutFinancement}"
                                    class="form-select">

                                <option th:each="statut : ${statutsFinancement}"
                                        th:value="${statut}"
                                        th:text="${statut.libelle}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Secteur d'activité</label>
                            <select class="form-select" th:field="*{sector}">
                                <option value="">Choisir un secteur</option>
                                <option value="Association">Association</option>
                                <option value="Formation">Organisme de formation</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="horizonProjet" class="form-label">
                                Horizon du projet
                            </label>

                            <select id="horizonProjet"
                                    th:field="*{horizonProjet}"
                                    class="form-select">

                                <option th:each="horizon : ${horizonsProjet}"
                                        th:value="${horizon}"
                                        th:text="${horizon.libelle}">
                                </option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Présentation de l'organisme</label>
                            <textarea class="form-control"
                                      th:field="*{description}"
                                      rows="3"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Besoin numérique potentiel</label>
                            <textarea class="form-control"
                                      th:field="*{potentialNeed}"
                                      rows="3"
                                      placeholder="Ex : gestion des adhérents, suivi des formations...">
                            </textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Enregistrer le prospect
                            </button>

                            <a th:href="@{/}" class="btn btn-outline-secondary">
                                Annuler
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
