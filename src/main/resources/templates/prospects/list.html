<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Liste des prospects - AI Prospect Hunter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            AI Prospect Hunter
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Mes prospects</h1>
            <p class="text-secondary mb-0">
                Retrouvez les organismes enregistrés.
            </p>
        </div>

        <a th:href="@{/prospects/nouveau}" class="btn btn-primary">
            + Ajouter un prospect
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(prospects)}"
                 class="alert alert-info mb-0">
                Aucun prospect enregistré pour le moment.
            </div>

            <!-- Formulaire de recherche -->
            <form th:action="@{/prospects}" method="get" class="card card-body mb-4">

                <div class="row g-3 align-items-end">

                    <div class="col-md-4">
                        <label for="name" class="form-label">Nom de l'organisme</label>
                        <input type="text"
                               id="name"
                               name="name"
                               class="form-control"
                               placeholder="Ex : Secours Catholique"
                               th:value="${name}">
                    </div>

                    <div class="col-md-4">
                        <label for="city" class="form-label">Ville</label>
                        <input type="text"
                               id="city"
                               name="city"
                               class="form-control"
                               placeholder="Ex : Chatou"
                               th:value="${city}">
                    </div>

                    <div class="col-md-3">
                        <label for="qualification" class="form-label">Qualification</label>
                        <select id="qualification"
                                name="qualification"
                                class="form-select">
                            <option value="">Toutes</option>
                            <option value="Prioritaire"
                                    th:selected="${qualification == 'Prioritaire'}">
                                Prioritaire
                            </option>
                            <option value="À étudier"
                                    th:selected="${qualification == 'À étudier'}">
                                À étudier
                            </option>
                            <option value="Faible potentiel"
                                    th:selected="${qualification == 'Faible potentiel'}">
                                Faible potentiel
                            </option>
                        </select>
                    </div>

                    <div class="col-md-1">
                        <button type="submit" class="btn btn-primary w-100">
                        Rechercher
                        </button>
                    </div>

                </div>
            </form>

            <div th:unless="${#lists.isEmpty(prospects)}"
                 class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>Organisme</th>
                        <th>Ville</th>
                        <th>Code postal</th>
                        <th>Secteur</th>
                        <th>Site web</th>
                        <th>Score</th>
                        <th>Qualification</th>
                        <th>Action</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="prospect : ${prospects}">

                        <td class="fw-semibold"
                            th:text="${prospect.name}">
                        </td>

                        <td th:text="${prospect.city ?: '-'}"></td>

                        <td th:text="${prospect.postalCode ?: '-'}"></td>

                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${prospect.sector ?: 'Non défini'}">
                            </span>
                        </td>

                        <td>
                            <a th:if="${prospect.website != null
                                       and !prospect.website.isBlank()}"
                               th:href="${prospect.website}"
                               th:text="'Visiter le site'"
                               target="_blank"
                               rel="noopener noreferrer">
                            </a>

                            <span th:unless="${prospect.website != null
                                              and !prospect.website.isBlank()}">
                                -
                            </span>
                        </td>
                        <td>
                            <strong th:text="${prospect.score}">0</strong>/100
                        </td>

                        <td>

                          <span th:if="${prospect.qualification == 'Prioritaire'}"
                             class="badge bg-success"
                             th:text="${prospect.qualification}">
                          </span>

                            <span th:if="${prospect.qualification == 'À étudier'}"
                                  class="badge bg-warning text-dark"
                                  th:text="${prospect.qualification}">
                            </span>
                            <span th:if="${prospect.qualification == 'Faible potentiel'}"
                                  class="badge bg-secondary"
                                  th:text="${prospect.qualification}">
                          </span>
                        </td>

                        <td>
                            <a th:href="@{/prospects/modifier/{id}(id=${prospect.id})}"
                               class="btn btn-sm btn-outline-primary">
                                Modifier
                            </a>
                        </td>
                        <td>
                            <form th:action="@{/prospects/supprimer/{id}(id=${prospect.id})}"
                                  method="post"
                                  class="delete-form"
                                  style="display:inline;">

                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    Supprimer
                                </button>
                            </form>
                        </td>

                    </tr>
                    </tbody>

                </table>
                <!-- Pagination -->
                <div th:if="${totalPages > 1}"
                     class="d-flex justify-content-between align-items-center mt-4">

    <span>
        Page <strong th:text="${currentPage + 1}"></strong>
        sur <strong th:text="${totalPages}"></strong>
        — <span th:text="${totalItems}"></span> prospects
    </span>

                    <div class="btn-group">

                        <a th:href="@{/prospects(
                page=${currentPage - 1},
                size=${pageSize},
                name=${name},
                city=${city},
                qualification=${qualification}
            )}"
                           th:classappend="${currentPage == 0} ? 'disabled'"
                           class="btn btn-outline-primary">
                            Précédent
                        </a>

                        <a th:href="@{/prospects(
                page=${currentPage + 1},
                size=${pageSize},
                name=${name},
                city=${city},
                qualification=${qualification}
            )}"
                           th:classappend="${currentPage >= totalPages - 1} ? 'disabled'"
                           class="btn btn-outline-primary">
                            Suivant
                        </a>

                    </div>
                </div>
            </div>

            <p th:unless="${#lists.isEmpty(prospects)}"
               class="text-secondary small mt-3 mb-0"
               th:text="'Nombre de prospects : ' + ${#lists.size(prospects)}">
            </p>

        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/}" class="btn btn-outline-secondary">
            Retour à l'accueil
        </a>
    </div>

</main>
<script th:src="@{/js/prospects.js}" defer></script>
</body>
</html>
