<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>

<body class="bg-light">

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">

            <div class="text-center mb-4">
                <h1 class="m-0">
                    <img th:src="@{/images/logo.png}" alt="Prospect Hunter IA - Recherche d'emploi assistée par IA"
                         class="img-fluid" width="320" height="184">
                </h1>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                        Identifiant ou mot de passe incorrect.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
                        Vous êtes déconnecté.
                    </div>

                    <!-- th:action ajoute automatiquement le jeton CSRF caché -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Identifiant</label>
                            <input type="text" id="username" name="username" class="form-control"
                                   autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Mot de passe</label>
                            <div class="input-group">
                                <input type="password" id="password" name="password" class="form-control"
                                       autocomplete="current-password" required>
                                <button type="button" class="btn btn-outline-secondary js-toggle-password"
                                        data-target="password" aria-label="Afficher le mot de passe" aria-pressed="false">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Se connecter
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</main>
<script th:src="@{/js/password-toggle.js}" defer></script>
</body>
</html>
