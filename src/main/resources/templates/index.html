<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AI Prospect Hunter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">AI Prospect Hunter</a>
    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="card border-0 shadow-sm">
                <div class="card-body p-5 text-center">
                    <div th:if="${successMessage}"
                         class="alert alert-success"
                         role="alert"
                         th:text="${successMessage}">
                    </div>

                    <h1 class="display-5 fw-bold mb-3">
                        Trouvez vos futurs clients
                    </h1>

                    <p class="lead text-secondary mb-4">
                        Identifiez les associations et organismes de formation
                        qui pourraient avoir besoin de solutions numériques.
                    </p>

                    <a th:href="@{/prospects/nouveau}"
                       class="btn btn-primary btn-lg">
                        <i class="bi bi-plus-circle"></i>
                        Ajouter un prospect
                    </a>
                    <a th:href="@{/prospects}"
                       class="btn btn-outline-primary btn-lg ms-2">
                        Voir les prospects
                    </a>

                    <p class="text-secondary small mt-3">
                        Votre assistant intelligent de prospection.
                    </p>

                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
