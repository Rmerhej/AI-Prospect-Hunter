spring:
  application:
    name: ai-prospect-hunter

  # Lit les variables du fichier .env (ignoré par Git) à la racine du projet
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3308/ai_prospect_hunter?serverTimezone=UTC
    username: prospect_app
    password: ${DB_PASSWORD}

  # ----- Agent IA : Gemini via Spring AI -----
  ai:
    google:
      genai:
        # Avec une clé API, Spring AI utilise l'API Gemini "développeur" (pas Vertex AI)
        api-key: ${prospect-hunter.ai.api-key}
        chat:
          model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
          # Faible "créativité" : des réponses plus factuelles et plus régulières
          temperature: 0.3
    retry:
      # 10 tentatives par défaut : trop long si la clé est fausse ou si la limite est atteinte
      max-attempts: 2

  # ----- Migrations : c'est Flyway, et non plus Hibernate, qui crée et modifie les tables -----
  flyway:
    # Base existante (créée par Hibernate) : Flyway la marque "version 1" sans rejouer V1
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # none : Hibernate ne touche plus au schéma. Toute modification passe par un fichier
      # db/migration/V2__..., V3__... (versionné, rejouable, relu en Pull Request)
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    session:
      persistent: false

# API publique Recherche d'entreprises (gratuite, sans clé)
prospect-hunter:
  ai:
    # Clé lue dans le fichier .env (GEMINI_API_KEY). Valeur par défaut : l'application démarre
    # sans clé, et la fiche prospect affiche un message clair au lieu de planter.
    api-key: ${GEMINI_API_KEY:a-configurer}

  api:
    recherche-entreprises:
      base-url: https://recherche-entreprises.api.gouv.fr

  # Connexion à l'application (lus dans .env)
  security:
    username: ${APP_USERNAME:roland}
    password: ${APP_PASSWORD:}

  # Signature ajoutée automatiquement à chaque brouillon d'e-mail
  signature:
    nom: Roland Merhej
    titre: Développeur d'applications web (titre professionnel CDA)
    ville: Chatou
    lien: https://www.linkedin.com/in/rolandmerhej
