spring:
  application:
    name: ai-prospect-hunter

  # Lit les variables du fichier .env (ignoré par Git) à la racine du projet
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3308/ai_prospect_hunter?serverTimezone=UTC
    username: prospect_app
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    session:
      persistent: false