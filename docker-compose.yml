services:
  prospect-db:
    image: mysql:8.0
    container_name: ai-prospect-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_prospect_hunter
      MYSQL_USER: prospect_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # 127.0.0.1 : MySQL accessible uniquement depuis votre PC, pas depuis le réseau
      - "127.0.0.1:3308:3306"
    volumes:
      - prospect-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  prospect-mysql-data:
